services:
  noshowguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noshowguard_service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - noshowguard_storage:/app/backend
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  noshowguard_storage:
